name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# Everything the tests need is written by them or is in TIC-80's own source:
# a cart whose program reads every control and the clocks
# (tests/make-tic80-cart.py), and TIC-80's demo cart of each language. So
# every test runs here, as before a push:
#   - TIC-80's source is the pinned commit with the patches applied, and the
#     package declares the controls the core has;
#   - every control reaches the cart, lag frames, the clock, the save
#     memory, the picture settings, and the sandboxed core gives the native
#     build's results with savestates;
#   - each language's demo cart runs, in the sandbox as natively;
#   - the package runs the test cart and a demo in Chimera's headless runner
#     and in its window;
#   - Chimera's own checks of the package pass.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 05:35 UTC. A nightly is published only when main moved since the last
    # one; the shared publishing workflow checks.
    - cron: '5 6 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other, and the publishing that depends on
# the cancelled run is skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (native against sandbox, the package, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # The lib*-dev packages are what Chimera's own build needs; this core
        # links none of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 curl xz-utils patch mono-complete xvfb libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build Chimera's engine
        working-directory: chimera-checkout
        run: |
          meson setup build/meson-linux --prefix "$PWD/build" --libdir dll
          meson compile -C build/meson-linux
          meson install -C build/meson-linux

      - name: Build Chimera's interface
        working-directory: chimera-checkout
        run: dotnet build source/gui/Chimera.sln -c Release /nodeReuse:false -p:UseSharedCompilation=false

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Lay the patches over TIC-80
        run: sh ./waterbox/apply-patches.sh

      - name: Build the native reference and the sandbox runner
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the sandboxed core and the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: sh ./waterbox/build-package.sh -r "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Run the test script
        # A run in which these did not pass has tested nothing, so they are
        # asked for by name.
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          rc=0
          bash ./waterbox/run-gate.sh > gate.out 2>&1 || rc=$?
          cat gate.out
          [ "$rc" -eq 0 ]
          for t in source:patched package:fresh package:controls package:key-names tic:runs tic:gamepads tic:keys tic:four-keys \
                   tic:mouse-buttons tic:mouse-place tic:mouse-move tic:scroll tic:clock tic:lag tic:sound tic:save-data \
                   tic:picture tic:sandbox tic:presses-change-the-run tic:state-every-frame tic:state-other-box tic:state-rewind \
                   lang:lua lang:moon lang:fennel lang:yue lang:js lang:squirrel lang:scheme lang:wren lang:wasm lang:janet \
                   lang:python lang:miniscript lang:forth refused:ruby refused:no-cart refused:not-a-cart cart:error engine:tic; do
            grep -q "^$t  *PASS " gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Run the window test
        # The package loaded by Chimera's own window (under Mono, on a
        # virtual display): the test cart's memory against the headless
        # runner's, the keys, and the Lua demo cart.
        run: |
          rc=0
          bash ./tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout" > window.out 2>&1 || rc=$?
          cat window.out
          [ "$rc" -eq 0 ]
          for t in window:tic window:keys window:demo; do
            grep -q "^$t  *PASS " window.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Chimera's checks of the package
        working-directory: chimera-checkout
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: |
          dotnet test source/gui/Chimera.Tests.Client.Common/Chimera.Tests.Client.Common.csproj \
            -c Release --nologo \
            --filter "FullyQualifiedName~InstalledCorePackagesTests|FullyQualifiedName~MnemonicUniquenessTests"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: tic80-${{ github.sha }}
          path: chimera-checkout/build/Cores/tic80.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            gate.out
            window.out

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: tic80
      artifact: tic80-${{ github.sha }}
      package: tic80.chimeraCore
      kind: ${{ github.event.inputs.kind }}
